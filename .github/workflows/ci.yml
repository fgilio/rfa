name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs, but never group `push` events together — otherwise
# back-to-back merges to main could silently drop intermediate CI runs even
# with cancel-in-progress=false. Using run_id for non-PR events gives every
# push its own (effectively empty) concurrency group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '20'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-php-composer
        with:
          php-version: ${{ env.PHP_VERSION }}
      - run: composer test:lint

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-php-composer
        with:
          php-version: ${{ env.PHP_VERSION }}
      # PHPStan stores per-file analysis results so unchanged code is skipped
      # on subsequent runs. Cache key only needs to flip when the analysed
      # source or PHPStan config changes; restore-keys lets us reuse a partial
      # cache when only a few files changed.
      - name: Cache PHPStan result cache
        uses: actions/cache@v5
        with:
          path: /tmp/phpstan
          key: phpstan-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('phpstan.neon.dist', 'app/**/*.php', 'database/factories/**/*.php') }}
          restore-keys: |
            phpstan-${{ runner.os }}-php${{ env.PHP_VERSION }}-
      - run: composer test:types

  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-php-composer
        with:
          php-version: ${{ env.PHP_VERSION }}
      - run: cp .env.example .env
      - run: php artisan key:generate
      # No `migrate` step: tests use DB_DATABASE=:memory: from phpunit.xml.
      - run: composer test

  # Browser tests are split into 4 parallel runners via Pest's native
  # `--shard=X/Y` (4.6+). Each shard also runs `--parallel` internally, so
  # total concurrency is (shards × per-runner workers).
  test-browser-shard:
    name: test-browser-shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-php-composer
        with:
          php-version: ${{ env.PHP_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium
      # On cache hit we do *nothing*: ubuntu-latest already ships Google Chrome
      # and the shared libraries Chromium needs, so the cached browser binary
      # launches without `playwright install-deps`. Skipping this step saves
      # ~18s per shard on every PR (apt update + apt install). On cache miss
      # (Playwright version bump) we still pay `--with-deps` once so a future
      # runner image change can't silently break us.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        name: Install Chromium + OS deps
        run: npx playwright install chromium --with-deps
      - run: cp .env.example .env
      - run: php artisan key:generate
      # No `migrate` step: browser tests use DB_DATABASE=:memory: from phpunit.xml,
      # and Pest spins the test server up in-process so it inherits that env.
      - name: Run browser tests (shard ${{ matrix.shard }}/4)
        run: ./vendor/bin/pest --testsuite=Browser --shard=${{ matrix.shard }}/4 --parallel --compact
      - name: Upload browser screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots-shard-${{ matrix.shard }}
          path: tests/Browser/Screenshots/
          if-no-files-found: ignore
          retention-days: 7

  # Aggregator check. Release ruleset (.github/CLAUDE.md) requires a status
  # named `test-browser`; this job preserves that name while gating on every
  # shard in the matrix above.
  test-browser:
    runs-on: ubuntu-latest
    needs: test-browser-shard
    if: always()
    steps:
      - name: All browser shards passed
        run: |
          if [ "${{ needs.test-browser-shard.result }}" != "success" ]; then
            echo "::error::test-browser-shard matrix result = ${{ needs.test-browser-shard.result }}"
            exit 1
          fi

  benchmark-perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-php-composer
        with:
          php-version: ${{ env.PHP_VERSION }}
      - run: cp .env.example .env
      - run: php artisan key:generate
      # No upfront `migrate`: BenchmarkPerformanceCommand provisions its own
      # isolated sqlite via BenchmarkIsolation::activate() and runs migrate
      # against that. The baseline / head sections below also run
      # `migrate:fresh` themselves.
      - name: Capture baseline benchmark on main
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git checkout --force ${{ github.event.pull_request.base.sha }}
            # Handle old src/ layout on base branch
            if [ -f src/composer.json ] && [ ! -f composer.json ]; then
              cd src
            fi
            composer install --no-interaction --prefer-dist --no-progress
          fi
          # Resolve app root (src/ on old commits, . on new)
          if [ -f src/artisan ] && [ ! -f artisan ]; then
            cd src
          fi
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate:fresh --force
          # Skip baseline if command does not exist on base branch (first-time bootstrap)
          if php artisan list --raw 2>/dev/null | grep -q 'rfa:benchmark-perf'; then
            php artisan rfa:benchmark-perf --snapshot=/tmp/rfa-perf-baseline.json
          else
            echo '{"generated_at":"bootstrap","results":{}}' > /tmp/rfa-perf-baseline.json
            echo "Benchmark command not available on base branch - using empty baseline"
          fi
      - name: Compare PR benchmark to baseline
        if: github.event_name == 'pull_request'
        run: |
          git checkout --force ${{ github.event.pull_request.head.sha }}
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate:fresh --force
          php artisan rfa:benchmark-perf --compare=/tmp/rfa-perf-baseline.json --max-regression=5
      - name: Report benchmark on main
        if: github.event_name != 'pull_request'
        run: php artisan rfa:benchmark-perf --compare=/tmp/rfa-perf-baseline.json --max-regression=5
